<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>rhel-ai-app</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3e;
      --accent: #cc0000;       /* Red Hat red */
      --accent-dim: #8b0000;
      --text: #e8e8ec;
      --text-dim: #7a7d8e;
      --success: #3ecf8e;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
      --sans: 'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 56px 1fr;
    }

    /* HEADER */
    header {
      grid-column: 1 / -1;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
    }
    header .logo {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: #fff;
    }
    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }
    header span {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--border);
      padding: 2px 8px;
      border-radius: 100px;
      margin-left: auto;
      font-family: var(--mono);
    }

    /* SIDEBAR */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 16px;
      overflow-y: auto;
    }
    aside h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .upload-zone {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-zone:hover { border-color: var(--accent); }
    .upload-zone p { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
    .upload-zone input { display: none; }

    #upload-btn {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #upload-btn:hover { background: var(--accent-dim); }
    #upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #upload-status {
      font-size: 11px;
      color: var(--success);
      min-height: 16px;
      font-family: var(--mono);
    }

    .doc-list { display: flex; flex-direction: column; gap: 6px; }
    .doc-item {
      font-size: 12px;
      color: var(--text-dim);
      padding: 6px 8px;
      background: var(--bg);
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: var(--mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .doc-item::before { content: "📄 "; }

    /* MAIN CHAT */
    main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 780px;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; }

    .msg-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.65;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      color: var(--text);
      font-family: var(--sans);
      white-space: pre-wrap;
      word-break: break-word;
      word-spacing: normal;
      letter-spacing: normal;
    }

    .cursor {
      display: inline-block;
      width: 2px; height: 14px;
      background: var(--accent);
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* INPUT BAR */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #query-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--sans);
      resize: none;
      outline: none;
      max-height: 120px;
      transition: border-color 0.2s;
    }
    #query-input:focus { border-color: var(--accent); }
    #query-input::placeholder { color: var(--text-dim); }

    #send-btn {
      padding: 10px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #send-btn:hover { background: var(--accent-dim); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* EMPTY STATE */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
    }
    .empty-state .icon { font-size: 40px; }
    .empty-state p { font-size: 14px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <div class="logo">R</div>
  <h1>rhel-ai-app</h1>
  <span>Granite · RAG · vLLM</span>
</header>

<!-- SIDEBAR -->
<aside>
  <h2>Documents</h2>

  <div class="upload-zone" onclick="document.getElementById('file-input').click()">
    <div style="font-size:24px">📂</div>
    <p>Click to upload PDF or TXT</p>
    <input type="file" id="file-input" accept=".pdf,.txt,.md,.docx" onchange="handleUpload(this)"/>
  </div>

  <button id="upload-btn" disabled>Upload</button>
  <div id="upload-status"></div>

  <h2>Ingested</h2>
  <div class="doc-list" id="doc-list">
    {% for doc in docs %}
    <div class="doc-item" title="{{ doc }}">{{ doc }}</div>
    {% else %}
    <div style="font-size:12px; color: var(--text-dim)">No docs yet.</div>
    {% endfor %}
  </div>
</aside>

<!-- CHAT -->
<main>
  <div id="chat-history">
    <div class="empty-state" id="empty-state">
      <div class="icon">🔍</div>
      <p>Upload a document, then ask anything.</p>
    </div>
  </div>

  <div class="input-bar">
    <textarea
      id="query-input"
      rows="1"
      placeholder="Ask about your documents..."
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="send-btn" onclick="sendQuery()">Ask</button>
  </div>
</main>

<script>
  let selectedFile = null;

  function handleUpload(input) {
    selectedFile = input.files[0];
    if (selectedFile) {
      document.getElementById('upload-btn').disabled = false;
      document.getElementById('upload-status').textContent = selectedFile.name;
    }
  }

  document.getElementById('upload-btn').addEventListener('click', async () => {
    if (!selectedFile) return;
    const btn = document.getElementById('upload-btn');
    const status = document.getElementById('upload-status');
    btn.disabled = true;
    btn.textContent = 'Ingesting...';
    status.textContent = '';

    const form = new FormData();
    form.append('file', selectedFile);

    try {
      const res = await fetch('/ingest', { method: 'POST', body: form });
      const data = await res.json();
      if (data.status === 'ok') {
        status.textContent = `✓ ${data.chunks} chunks ingested`;
        refreshDocList();
      } else {
        status.textContent = `✗ ${data.message}`;
      }
    } catch (e) {
      status.textContent = '✗ Upload failed';
    } finally {
      btn.textContent = 'Upload';
      selectedFile = null;
      document.getElementById('file-input').value = '';
    }
  });

  async function refreshDocList() {
    const res = await fetch('/docs-list');
    const data = await res.json();
    const list = document.getElementById('doc-list');
    list.innerHTML = data.docs.length
      ? data.docs.map(d => `<div class="doc-item" title="${d}">${d}</div>`).join('')
      : '<div style="font-size:12px; color: var(--text-dim)">No docs yet.</div>';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuery();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function appendMessage(role, text) {
    const history = document.getElementById('chat-history');
    document.getElementById('empty-state')?.remove();

    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    wrap.innerHTML = `
      <div class="msg-label">${role === 'user' ? 'You' : 'Granite'}</div>
      <div class="msg-bubble">${text}</div>
    `;
    history.appendChild(wrap);
    history.scrollTop = history.scrollHeight;
    return wrap.querySelector('.msg-bubble');
  }

  async function sendQuery() {
    const input = document.getElementById('query-input');
    const btn = document.getElementById('send-btn');
    const query = input.value.trim();
    if (!query) return;

    input.value = '';
    input.style.height = 'auto';
    btn.disabled = true;

    appendMessage('user', query);

    const bubble = appendMessage('assistant', '');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.appendChild(cursor);

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const raw = line.slice(5);
          if (raw.trim() === '[DONE]') break;
          fullText += raw;
          cursor.previousSibling?.remove();
          bubble.insertBefore(document.createTextNode(fullText), cursor);
          document.getElementById('chat-history').scrollTop = 99999;
        }
      }
    } catch (e) {
      bubble.insertBefore(document.createTextNode('Error connecting to server.'), cursor);
    } finally {
      cursor.remove();
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
